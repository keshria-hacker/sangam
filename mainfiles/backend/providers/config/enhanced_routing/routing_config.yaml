# Enhanced Provider Routing Configuration for Sangam
# Generated by Hermes Agent - Customize as needed

default_policy: default
enable_cost_optimization: true
enable_geo_routing: false
enable_model_routing: true
enable_quality_optimization: true
enable_time_based_routing: false
enabled: true
health_check_interval_seconds: 30.0
metrics_window_size: 100
policies:
