# =============================================================================
# supervisord.conf — Process manager for backend + frontend
# =============================================================================

[supervisord]
nodaemon=true
user=sangam
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs

[program:backend]
command=uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/app/logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED=1

[program:frontend]
command=python -m http.server 5500
directory=/app/frontend
autostart=true
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/app/logs/frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/frontend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED=1