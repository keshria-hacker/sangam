name: CI

on:
  push:
    branches: [main, sangam]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r mainfiles/backend/requirements-dev.txt
      - name: Validate Python sources
        run: python -m compileall -q mainfiles/backend start.py scripts tests
      - name: Run tests
        env:
          TEST_MODE: "1"
        run: python -m pytest tests/ -q
      - name: Validate browser scripts
        run: |
          find mainfiles/frontend/js -name "*.js" -print0 | xargs -0 -n1 node --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit (static analysis)
        run: bandit -r mainfiles/backend/ -f json -o bandit-report.json || true
      - name: Safety (dependency vulnerabilities)
        run: safety check --json --output safety-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
