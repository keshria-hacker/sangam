name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r mainfiles/backend/requirements-dev.txt
      - name: Validate Python sources
        run: python -m compileall -q mainfiles/backend start.py scripts tests
      - name: Run tests with coverage
        env:
          TEST_MODE: "1"
          PYTHONPATH: mainfiles
        run: python -m pytest tests -q --cov=backend --cov-report=term-missing
      - name: Enforce coverage gate
        run: python -m coverage report --fail-under=66
      - name: Validate browser scripts
        run: find mainfiles/frontend/js -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Validate frontend module graph (parse + link)
        run: node --experimental-vm-modules scripts/check_frontend_modules.mjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit (static analysis)
        run: bandit -r mainfiles/backend/ --exclude mainfiles/backend/tests,mainfiles/backend/migrations -f json -o bandit-report.json || true
      - name: Safety (dependency vulnerabilities)
        run: safety check --json --output safety-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
