# =============================================================================
# docker-compose.all.yml — Single container: Backend + Frontend
# =============================================================================

services:
  sangam-all:
    build:
      context: .
      dockerfile: Dockerfile.all
    image: sangam-all:latest
    container_name: sangam-all
    ports:
      - "8001:8001"   # Backend API
      - "5500:5500"   # Frontend
    env_file:
      - .env
    environment:
      # Ollama on host machine (Docker Desktop provides host.docker.internal)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # Persist data across container restarts
      - sangam_history:/app/history
      - sangam_uploads:/app/uploads
      - sangam_chromadb:/app/.chromadb
      - sangam_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sangam_net

  # Optional Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: sangam-redis
    ports:
      - "6379:6379"
    volumes:
      - sangam_redis:/data
    restart: unless-stopped
    profiles:
      - redis
    networks:
      - sangam_net

volumes:
  sangam_history:
  sangam_uploads:
  sangam_chromadb:
  sangam_logs:
  sangam_redis:

networks:
  sangam_net:
    driver: bridge